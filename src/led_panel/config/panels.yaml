canvas:
  width: 640
  height: 640

panel_size:
  width: 64    # pixels per panel
  height: 64
  physical_cm: 19  # physical size in cm (for reference)

# 10x10 grid of panels = 640x640 pixels total
# row/col are 0-indexed (0-9)
# To replace a panel: set enabled: false
